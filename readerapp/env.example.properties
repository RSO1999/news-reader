# Copy this file to env.local.properties and customize it for your setup.
# The app reads BASE_URL from env.local.properties first, then falls back to this file.
#
# If your API is running on the same machine as the Android emulator:
BASE_URL=http://10.0.2.2:8080/
#
# If you are using a physical Android device on the same Wi-Fi as your API server,
# replace 10.0.2.2 with your computer's LAN IP, for example:
# BASE_URL=http://192.168.1.42:8080/
#
# If you are using a hosted backend, prefer HTTPS:
# BASE_URL=https://api.example.com/
#
# Cleartext HTTP is enabled automatically only when BASE_URL starts with http://.

